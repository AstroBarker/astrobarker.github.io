<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v={{ site.time | date: '%s' }}">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon.png?v={{ site.time | date: '%s' }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v={{ site.time | date: '%s' }}">
    <meta charset="utf-8">
    <title>{{ page.title }}</title>

    <script>
      (function () {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem('theme');
        } catch (error) {
          // Use the system preference when storage is unavailable.
        }

        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        const theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : systemTheme;

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark-mode', theme === 'dark');
      }());
    </script>

    <!-- syntax highlighting CSS -->
    <link rel="stylesheet" href="/css/syntax.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css?v={{ site.time | date: '%s' }}">

    {% seo %}

    <!-- Google Analytics -->
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

      ga('create', 'UA-58926260-1', 'auto');
      ga('send', 'pageview');
    </script>

    <script data-goatcounter="https://astrobarker.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body class="site md">
    <div class="theme-control">
      <button class="theme-toggle" id="theme-toggle" type="button"
              aria-label="Toggle color theme" aria-pressed="false">[theme: system]</button>
    </div>

    <!-- begin subtemplate -->
    {% include anchor_headings.html
      html=content
      anchorBody=""
      beforeHeading=true
      anchorClass="anchor"
    %}
    <!-- end subtemplate -->
    <script>
      (function () {
        const themeToggle = document.getElementById('theme-toggle');
        if (!themeToggle) return;

        const root = document.documentElement;
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');

        const updateToggle = () => {
          const darkMode = root.getAttribute('data-theme') === 'dark';
          themeToggle.textContent = `[theme: ${darkMode ? 'dark' : 'light'}]`;
          themeToggle.setAttribute('aria-pressed', darkMode.toString());
          themeToggle.setAttribute(
            'aria-label',
            `Switch to ${darkMode ? 'light' : 'dark'} theme`
          );
        };

        const storedTheme = () => {
          try {
            return localStorage.getItem('theme');
          } catch (error) {
            return null;
          }
        };

        const applyTheme = (theme, persist) => {
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark-mode', theme === 'dark');
          document.body.classList.toggle('dark-mode', theme === 'dark');
          if (persist) {
            try {
              localStorage.setItem('theme', theme);
            } catch (error) {
              // The selected theme still applies for the current page view.
            }
          }
          updateToggle();
        };

        themeToggle.addEventListener('click', () => {
          const theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(theme, true);
        });

        const followSystemTheme = (event) => {
          if (storedTheme() !== 'dark' && storedTheme() !== 'light') {
            applyTheme(event.matches ? 'dark' : 'light', false);
          }
        };

        if (systemTheme.addEventListener) {
          systemTheme.addEventListener('change', followSystemTheme);
        } else {
          systemTheme.addListener(followSystemTheme);
        }

        applyTheme(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);
      }());
    </script>

  </body>
</html>
